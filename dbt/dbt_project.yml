name: sport_data
version: "1.0.0"
config-version: 2

# Nom de la connexion à utiliser, définie dans profiles.yml
profile: sport_data

model-paths: ["models"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  sport_data:
    # Staging : une vue par source, renommage et typage uniquement
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    # Marts : tables écrites dans postgres-dwh (lu par Tableau) + copie Parquet dans MinIO
    marts:
      +materialized: table
      +database: dwh
      +schema: marts
      +post-hook: "{{ export_minio_clean() }}"
    # Monitoring : une photo de l'état du pipeline à chaque dbt build (lue par Grafana)
    monitoring:
      +materialized: incremental
      +database: dwh
      +schema: monitoring

# Seuils de validation modifiables sans toucher au SQL (dossier seeds/)
seeds:
  sport_data:
    +schema: seeds

vars:
  adresse_entreprise: "1362 Av. des Platanes, 34970 Lattes"
  # Règles des avantages (note de cadrage)
  taux_prime_sportive: 0.05 # 5 % du salaire annuel brut
  nb_jours_bien_etre: 5
  nb_activites_min_bien_etre: 15 # activités sur les 12 derniers mois
  nb_jours_travailles_an: 218 # pour valoriser une journée bien-être (salaire / jours)
